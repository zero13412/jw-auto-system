<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>杰運汽車內部系統 - 阿鍇專用</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #F3F4F6; }
        .grid-button { transition: transform 0.1s, box-shadow 0.1s; }
        .grid-button:active { transform: scale(0.95); box-shadow: none; }
        .locked { opacity: 0.5; filter: grayscale(100%); pointer-events: none; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- 身份認證 Modal -->
    <div id="authModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4 border border-gray-100">
            <h2 class="text-2xl font-black text-gray-800 mb-6 text-center">🔐 系統登入</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">請輸入您的姓名</label>
                    <input type="text" id="userNameInput" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="例如：林阿鍇">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">請輸入您的 LINE ID</label>
                    <input type="text" id="userIdInput" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" placeholder="輸入在 LINE 取得的 ID">
                    <p class="text-xs text-gray-500 mt-2 font-bold">💡 忘記 ID？請在 LINE 群組輸入「我的ID」即可獲取。</p>
                </div>
                <button onclick="submitAuth()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-lg mt-4 shadow-md transition active:scale-95">登入系統</button>
            </div>
        </div>
    </div>

    <!-- 載入中遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-40 flex flex-col items-center justify-center font-bold text-blue-600 text-xl hidden">
        <div class="animate-spin text-4xl mb-4">🔄</div>
        正在與後台核對權限，請稍候...
    </div>

    <div id="mainContent" class="hidden flex-1 overflow-y-auto">
        <header class="bg-slate-800 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-20">
            <h1 class="text-xl font-bold tracking-wider">杰運汽車內部系統 <span class="text-sm font-normal text-blue-300">v2.1</span></h1>
            <div id="userBadge" class="bg-slate-700 px-3 py-1 rounded-full text-sm font-bold border border-slate-600 shadow-inner">
                👤 未登入
            </div>
        </header>

        <main class="p-4 sm:p-6 max-w-4xl mx-auto pb-20">
            
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h2 class="text-2xl font-black text-gray-800">歡迎使用 👏</h2>
                    <p class="text-gray-500 font-bold mt-1 text-sm">請點擊下方按鈕開始您的工作</p>
                </div>
                <button onclick="logout()" class="text-sm text-red-500 font-bold hover:bg-red-50 px-3 py-1 rounded transition border border-red-100 bg-white">登出</button>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6">
                
                <a href="cars" id="btn-cars" class="locked grid-button bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl p-4 sm:p-6 text-white shadow-lg flex flex-col items-center justify-center text-center group border border-blue-400">
                    <span class="text-3xl sm:text-4xl mb-2 sm:mb-3 group-hover:scale-110 transition-transform">🚗</span>
                    <span class="font-bold text-sm sm:text-base">E車源看板</span>
                    <span class="text-xs text-blue-200 mt-1 hidden sm:block">即時查車與價錢</span>
                </a>

                <a href="dispatch" id="btn-dispatch" class="locked grid-button bg-gradient-to-br from-cyan-500 to-cyan-700 rounded-xl p-4 sm:p-6 text-white shadow-lg flex flex-col items-center justify-center text-center group border border-cyan-400">
                    <span class="text-3xl sm:text-4xl mb-2 sm:mb-3 group-hover:scale-110 transition-transform">🚚</span>
                    <span class="font-bold text-sm sm:text-base">調度系統</span>
                    <span class="text-xs text-cyan-200 mt-1 hidden sm:block">生成話術與報備</span>
                </a>

                <a href="reply" id="btn-reply" class="locked grid-button bg-gradient-to-br from-fuchsia-500 to-fuchsia-700 rounded-xl p-4 sm:p-6 text-white shadow-lg flex flex-col items-center justify-center text-center group border border-fuchsia-400">
                    <span class="text-3xl sm:text-4xl mb-2 sm:mb-3 group-hover:scale-110 transition-transform">📋</span>
                    <span class="font-bold text-sm sm:text-base">快捷回覆</span>
                    <span class="text-xs text-fuchsia-200 mt-1 hidden sm:block">匯款刷卡常用連結</span>
                </a>
                
                <a href="ad" id="btn-ad" class="locked grid-button bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-xl p-4 sm:p-6 text-white shadow-lg flex flex-col items-center justify-center text-center group border border-emerald-400">
                    <span class="text-3xl sm:text-4xl mb-2 sm:mb-3 group-hover:scale-110 transition-transform">📝</span>
                    <span class="font-bold text-sm sm:text-base">寫廣告神器</span>
                    <span class="text-xs text-emerald-200 mt-1 hidden sm:block">一鍵產出吸引文案</span>
                </a>

                <a href="buyback" id="btn-buyback" class="locked grid-button bg-gradient-to-br from-rose-500 to-rose-700 rounded-xl p-4 sm:p-6 text-white shadow-lg flex flex-col items-center justify-center text-center group border border-rose-400">
                    <span class="text-3xl sm:text-4xl mb-2 sm:mb-3 group-hover:scale-110 transition-transform">🛑</span>
                    <span class="font-bold text-sm sm:text-base">買回停駛</span>
                    <span class="text-xs text-rose-200 mt-1 hidden sm:block">合約資料快速查詢</span>
                </a>

                <a href="sales_stats" id="btn-sales_stats" class="locked grid-button bg-gradient-to-br from-amber-500 to-amber-700 rounded-xl p-4 sm:p-6 text-white shadow-lg flex flex-col items-center justify-center text-center group border border-amber-400">
                    <span class="text-3xl sm:text-4xl mb-2 sm:mb-3 group-hover:scale-110 transition-transform">🏆</span>
                    <span class="font-bold text-sm sm:text-base">當月成交</span>
                    <span class="text-xs text-amber-200 mt-1 hidden sm:block">業績戰情排行榜</span>
                </a>

            </div>

            <div id="btn-update" class="locked mt-8 bg-white rounded-xl shadow-sm border border-gray-200 p-5 sm:p-6 transition-all">
                <h3 class="font-black text-gray-800 text-lg mb-3 flex items-center gap-2">⚡ 系統資料更新中心</h3>
                
                <div class="space-y-4">
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-4">
                        <button id="syncBtn" onclick="syncBackend()" class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-bold py-3 px-4 rounded shadow-sm transition active:scale-95 flex items-center justify-center gap-2 text-sm sm:text-base">
                            <span>🌐 自動更新車源表 (需等待3-5分鐘)</span>
                        </button>
                        
                        <!-- 系統進度條 -->
                        <div id="uploadStatus" class="mt-3 text-sm font-bold text-blue-700 hidden text-center"></div>
                        <div id="progressContainer" class="w-full bg-gray-200 rounded-full h-2.5 mt-2 hidden overflow-hidden shadow-inner">
                            <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>

                        <!-- 💡 雲端自動定時更新設定區塊 -->
                        <div class="bg-indigo-50 rounded-lg p-3 mt-4 border border-indigo-100 flex flex-col gap-2">
                            <div class="flex items-center justify-between">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="autoUpdateToggle" onchange="handleAutoUpdateToggle()" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
                                    <span class="text-sm font-bold text-indigo-800">開啟雲端定時更新</span>
                                </label>
                                <select id="autoUpdateInterval" onchange="handleIntervalChange()" class="text-xs border border-indigo-200 rounded p-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-400 text-indigo-700 font-bold cursor-pointer" disabled>
                                    <option value="5">每 5 分鐘</option>
                                    <option value="15" selected>每 15 分鐘</option>
                                    <option value="30">每 30 分鐘</option>
                                    <option value="60">每 1 小時</option>
                                </select>
                            </div>
                            <div id="autoUpdateCountdown" class="text-xs text-indigo-600 font-bold text-center hidden bg-white py-1.5 rounded border border-indigo-100">
                                ☁️ 雲端排程已生效！關閉網頁也會自動執行。
                            </div>
                        </div>
                    </div>

                    <hr id="dividerLine" class="w-full border-indigo-100 my-1" style="display: none;">

                    <div id="credentialInputs" class="bg-gray-50 border border-gray-200 rounded-lg p-4 space-y-3 hidden">
                        <p class="text-sm font-bold text-red-600 mb-2">⚠️ 系統無法登入杰運後台，請手動輸入最新密碼</p>
                        <input type="text" id="sysUser" placeholder="後台帳號 (例: Admin02)" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none font-bold">
                        <input type="password" id="sysPwd" placeholder="後台密碼" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none font-bold">
                        <button onclick="retrySyncBackend()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 rounded shadow-sm transition active:scale-95 text-sm">
                            用新密碼重新啟動更新
                        </button>
                    </div>

                    <button id="unlockBtn" onclick="forceUnlock()" class="w-full mt-2 text-xs text-gray-400 hover:text-red-500 underline font-bold transition">
                        🛑 強制停止重置 (僅系統卡死時使用)
                    </button>
                </div>
            </div>

            <!-- 客資專區 -->
            <div id="btn-crm" class="locked mt-4 bg-white rounded-xl shadow-sm border border-gray-200 p-5 transition-all">
                <h3 class="font-black text-gray-800 text-lg mb-3 flex items-center gap-2">👥 客資管理區</h3>
                <div class="bg-gray-50 border border-gray-100 rounded-lg p-4">
                    <label class="w-full cursor-pointer bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded shadow-sm transition active:scale-95 flex items-center justify-center gap-2 text-sm sm:text-base border border-slate-600">
                        <span>📤 上傳客資 Excel (或傳至LINE)</span>
                        <input type="file" id="crmUploadInput" accept=".xlsx" class="hidden" onchange="uploadCrmFile()">
                    </label>
                    <div id="crmUploadStatus" class="mt-3 text-sm font-bold text-slate-700 hidden text-center"></div>
                </div>
            </div>

            <!-- 上傳查定表/庫存 -->
            <div id="btn-upload" class="locked mt-4 bg-white rounded-xl shadow-sm border border-gray-200 p-5 transition-all">
                <h3 class="font-black text-gray-800 text-lg mb-3 flex items-center gap-2">📤 上傳總表 (不建議手動)</h3>
                <div class="bg-gray-50 border border-gray-100 rounded-lg p-4">
                    <label class="w-full cursor-pointer bg-white hover:bg-gray-100 text-gray-700 font-bold py-3 px-4 rounded shadow-sm transition active:scale-95 flex items-center justify-center gap-2 text-sm sm:text-base border border-gray-300">
                        <span>📤 上傳 E車源 或 新竹車源 Excel</span>
                        <input type="file" id="fileInput" accept=".xlsx" class="hidden" onchange="uploadFile()">
                    </label>
                    <div id="fileUploadStatus" class="mt-3 text-sm font-bold text-gray-700 hidden text-center"></div>
                </div>
            </div>

        </main>
    </div>

    <script>
        let myPermissions = {};
        let loginModalResolve = null;
        let progressInterval = null; 
        
        let isSystemSyncing = false;
        let autoPollTimer = null;

        // 💡 全新的獨立背景雷達掃描器 (每1.5秒檢查一次背景任務狀態)
        async function pollSystemSync() {
            try {
                const res = await fetch('/api/sync_progress');
                const data = await res.json();
                
                const syncBtn = document.getElementById('syncBtn');
                const statusDiv = document.getElementById('uploadStatus');
                const progressContainer = document.getElementById('progressContainer');
                const progressBar = document.getElementById('progressBar');
                const credsDiv = document.getElementById('credentialInputs');
                const divider = document.getElementById('dividerLine');

                isSystemSyncing = data.is_running;

                if (isSystemSyncing) {
                    syncBtn.disabled = true;
                    syncBtn.classList.replace('bg-blue-600', 'bg-gray-400');
                    syncBtn.innerHTML = "⏳ 系統背景更新中...";
                    
                    statusDiv.textContent = data.message || "更新中...";
                    statusDiv.style.display = "block";
                    statusDiv.classList.replace('text-green-600', 'text-blue-700');
                    statusDiv.classList.replace('text-red-600', 'text-blue-700');
                    
                    progressContainer.style.display = "block";
                    progressBar.style.width = (data.progress || 1) + "%";

                    credsDiv.classList.add('hidden');
                    divider.style.display = 'none';

                } else {
                    syncBtn.disabled = false;
                    syncBtn.classList.replace('bg-gray-400', 'bg-blue-600');
                    syncBtn.innerHTML = "🌐 自動更新車源表 (需等待3-5分鐘)";
                    
                    if (data.progress === 100) {
                        statusDiv.textContent = data.message;
                        statusDiv.classList.replace('text-blue-700', 'text-green-600');
                        statusDiv.style.display = "block";
                        progressBar.style.width = "100%";
                        setTimeout(() => { 
                            statusDiv.style.display = "none";
                            progressContainer.style.display = "none";
                            progressBar.style.width = "0%";
                        }, 5000);
                    } else if (data.message && data.message.includes("密碼") || data.message.includes("Login Failed")) {
                        statusDiv.style.display = "none";
                        progressContainer.style.display = "none";
                        credsDiv.classList.remove('hidden');
                        divider.style.display = 'block';
                    } else if (data.progress === 0 && data.message !== "系統準備就緒") {
                        statusDiv.textContent = data.message;
                        statusDiv.classList.replace('text-blue-700', 'text-red-600');
                        statusDiv.style.display = "block";
                        progressContainer.style.display = "none";
                        setTimeout(() => { statusDiv.style.display = "none"; }, 5000);
                    }
                }

                // 不斷輪詢
                clearTimeout(autoPollTimer);
                autoPollTimer = setTimeout(pollSystemSync, 1500);

            } catch (e) {
                clearTimeout(autoPollTimer);
                autoPollTimer = setTimeout(pollSystemSync, 3000);
            }
        }

        async function showLoginModal() {
            document.getElementById('authModal').classList.remove('hidden');
            return new Promise(resolve => { loginModalResolve = resolve; });
        }

        function submitAuth() {
            const userName = document.getElementById('userNameInput').value.trim();
            const userId = document.getElementById('userIdInput').value.trim();
            if (!userName || !userId) { alert("請完整填寫姓名與 LINE ID"); return; }
            document.getElementById('authModal').classList.add('hidden');
            if (loginModalResolve) loginModalResolve({ userName, userId });
        }

        function logout() {
            localStorage.removeItem('jw_user_id');
            localStorage.removeItem('jw_user_name');
            localStorage.removeItem('jw_permissions');
            window.location.reload();
        }

        function updateUserBadge(perms, name) {
            const isSuper = String(perms['最高管理員'] || '').toUpperCase() === 'V';
            const exp = perms['到期日'] || '無期限';
            document.getElementById('userBadge').innerHTML = isSuper ? 
                `👑 最高權限 (${name})` : `👤 ${name} <span class="text-xs opacity-75">(${exp})</span>`;
            document.getElementById('userBadge').classList.toggle('bg-yellow-600', isSuper);
            document.getElementById('userBadge').classList.toggle('border-yellow-500', isSuper);
        }

        async function initAuth() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            let userId = localStorage.getItem('jw_user_id');
            let userName = localStorage.getItem('jw_user_name');

            if (!userId || !userName) {
                document.getElementById('loadingOverlay').style.display = 'none';
                const credentials = await showLoginModal();
                userId = credentials.userId;
                userName = credentials.userName;
                document.getElementById('loadingOverlay').style.display = 'flex';
            }

            try {
                const res = await fetch(`/api/my_permissions?user_id=${encodeURIComponent(userId)}&user_name=${encodeURIComponent(userName)}`);
                const data = await res.json();
                
                if (data.status !== "success") {
                    alert("連線失敗：" + data.message);
                    logout(); return;
                }

                if (data.is_new) {
                    alert("✅ 您的帳號已提交建檔！請通知阿鍇為您開通權限後，再重新整理本頁面。");
                    document.getElementById('loadingOverlay').innerHTML = "請等待開通權限後重新整理";
                    return;
                }

                myPermissions = data.permissions;
                localStorage.setItem('jw_user_id', userId);
                localStorage.setItem('jw_user_name', userName);
                localStorage.setItem('jw_permissions', JSON.stringify(myPermissions));

                const isSuper = String(myPermissions['最高管理員']).toUpperCase() === 'V';
                
                // 開通首頁按鈕權限
                if (isSuper || String(myPermissions['E車源看板']).toUpperCase() === 'V') document.getElementById('btn-cars').classList.remove('locked');
                if (isSuper || String(myPermissions['調度系統']).toUpperCase() === 'V') document.getElementById('btn-dispatch').classList.remove('locked');
                if (isSuper || String(myPermissions['快速回覆']).toUpperCase() === 'V') document.getElementById('btn-reply').classList.remove('locked');
                if (isSuper || String(myPermissions['寫廣告神器']).toUpperCase() === 'V') document.getElementById('btn-ad').classList.remove('locked');
                if (isSuper || String(myPermissions['更新車源']).toUpperCase() === 'V') document.getElementById('btn-update').classList.remove('locked');
                if (isSuper || String(myPermissions['買回停駛']).toUpperCase() === 'V') document.getElementById('btn-buyback').classList.remove('locked');
                if (isSuper || String(myPermissions['客資系統']).toUpperCase() === 'V') document.getElementById('btn-crm').classList.remove('locked');
                if (isSuper || String(myPermissions['當月成交']).toUpperCase() === 'V') document.getElementById('btn-sales_stats').classList.remove('locked');
                if (isSuper || String(myPermissions['上傳檔案']).toUpperCase() === 'V') document.getElementById('btn-upload').classList.remove('locked');

                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                updateUserBadge(myPermissions, userName);
                
                // 💡 登入成功後立刻觸發一次雷達，看有沒有人在更新
                pollSystemSync();
                loadServerTimer(); // 💡 載入雲端排程狀態
                
            } catch (err) { 
                console.error(err);
                document.getElementById('loadingOverlay').innerHTML = "❌ 系統連線異常，請重新整理";
            }
        }

        // 💡 升級版背景觸發器 (一按就丟給背景跑，網頁立刻釋放)
        async function syncBackend(retryUser = null, retryPwd = null) {
            const statusDiv = document.getElementById('uploadStatus');
            const syncBtn = document.getElementById('syncBtn');
            
            // 先在畫面做樂觀顯示，讓使用者知道有點到按鈕
            statusDiv.textContent = "🚀 正在發送更新請求至背景...";
            statusDiv.style.display = "block";
            statusDiv.className = "mt-3 text-sm font-bold text-blue-700 text-center";
            syncBtn.disabled = true;

            try {
                const curUserId = localStorage.getItem('jw_user_id') || "";
                let url = `/api/sync_car_source?user_id=${encodeURIComponent(curUserId)}`;
                if (retryUser && retryPwd) {
                    url += `&u=${encodeURIComponent(retryUser)}&p=${encodeURIComponent(retryPwd)}`;
                }

                const res = await fetch(url);
                const data = await res.json();
                
                if (data.status === "error") {
                    alert(data.message);
                    statusDiv.style.display = "none";
                    syncBtn.disabled = false;
                } else if (data.status === "need_login") {
                    statusDiv.style.display = "none";
                    document.getElementById('credentialInputs').classList.remove('hidden');
                    document.getElementById('dividerLine').style.display = 'block';
                }
                // 如果是 running 或 started，不用特別處理，交給雷達去掃描更新 UI
                
            } catch (e) {
                statusDiv.textContent = "❌ 請求發送失敗，請檢查網路！";
                statusDiv.classList.replace('text-blue-700', 'text-red-600');
                setTimeout(() => { statusDiv.style.display = "none"; syncBtn.disabled = false; }, 3000);
            }
        }

        function retrySyncBackend() {
            const u = document.getElementById('sysUser').value.trim();
            const p = document.getElementById('sysPwd').value.trim();
            if (!u || !p) { alert("請填寫帳號密碼！"); return; }
            syncBackend(u, p);
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('fileUploadStatus');
            statusDiv.style.display = "block";
            statusDiv.className = "mt-3 text-sm font-bold text-blue-600 text-center";
            statusDiv.textContent = "⏳ 檔案上傳解析中...";

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload_excel', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.status === 'success') {
                    statusDiv.className = "mt-3 text-sm font-bold text-green-600 text-center";
                    statusDiv.innerHTML = result.message.replace(/\n/g, '<br>');
                } else {
                    statusDiv.className = "mt-3 text-sm font-bold text-red-600 text-center";
                    statusDiv.textContent = "❌ " + result.message;
                }
            } catch (error) {
                statusDiv.className = "mt-3 text-sm font-bold text-red-600 text-center";
                statusDiv.textContent = "❌ 上傳失敗，請檢查網路連線";
            } finally {
                fileInput.value = "";
            }
        }

        async function uploadCrmFile() {
            const fileInput = document.getElementById('crmUploadInput');
            const file = fileInput.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('crmUploadStatus');
            statusDiv.style.display = "block";
            statusDiv.className = "mt-3 text-sm font-bold text-slate-600 text-center";
            statusDiv.textContent = "⏳ 處理客資中...";

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload_excel', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.status === 'success') {
                    statusDiv.className = "mt-3 text-sm font-bold text-emerald-600 text-center";
                    statusDiv.innerHTML = result.message.replace(/\n/g, '<br>');
                } else {
                    statusDiv.className = "mt-3 text-sm font-bold text-red-600 text-center";
                    statusDiv.textContent = "❌ " + result.message;
                }
            } catch (error) {
                statusDiv.className = "mt-3 text-sm font-bold text-red-600 text-center";
                statusDiv.textContent = "❌ 上傳失敗";
            } finally { fileInput.value = ""; }
        }

        async function forceUnlock() {
            if (!confirm("確定要強制停止並重置系統嗎？\n⚠️ 僅建議在系統卡死超過5分鐘沒有動靜時使用。")) return;
            
            const unlockBtn = document.getElementById('unlockBtn');
            if (unlockBtn) unlockBtn.innerHTML = "⏳ 停止中...";

            try {
                const curUserId = localStorage.getItem('jw_user_id') || "";
                await fetch(`/api/force_unlock?user_id=${encodeURIComponent(curUserId)}`);
                // UI 復原與提示會交由 pollSystemSync 自動接管處理！
            } catch (e) {
                alert("❌ 網路異常，無法發送中斷訊號。");
                if (unlockBtn) unlockBtn.innerHTML = "🛑 強制停止重置";
            }
        }

        // 💡 雲端自動更新的邏輯函式
        async function loadServerTimer() {
            try {
                const res = await fetch('/api/server_timer');
                const data = await res.json();
                
                const toggle = document.getElementById('autoUpdateToggle');
                const intervalSelect = document.getElementById('autoUpdateInterval');
                const msgDiv = document.getElementById('autoUpdateCountdown');

                if (toggle) toggle.checked = data.enabled;
                if (intervalSelect) {
                    intervalSelect.value = data.interval;
                    intervalSelect.disabled = !data.enabled;
                }
                if (msgDiv) {
                    if (data.enabled) msgDiv.classList.remove('hidden');
                    else msgDiv.classList.add('hidden');
                }
            } catch (e) { console.error("無法讀取雲端排程", e); }
        }

        async function handleAutoUpdateToggle() {
            const enabled = document.getElementById('autoUpdateToggle').checked;
            const interval = document.getElementById('autoUpdateInterval').value;
            document.getElementById('autoUpdateInterval').disabled = !enabled;
            
            const msgDiv = document.getElementById('autoUpdateCountdown');
            if (enabled) msgDiv.classList.remove('hidden');
            else msgDiv.classList.add('hidden');
            
            try {
                await fetch('/api/server_timer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: enabled, interval: parseInt(interval) })
                });
            } catch (e) { alert("❌ 雲端排程設定失敗"); }
        }

        async function handleIntervalChange() {
            if (document.getElementById('autoUpdateToggle').checked) {
                await handleAutoUpdateToggle();
            }
        }

        window.onload = initAuth;
    </script>
</body>
