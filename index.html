<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 杰運汽車 - 內部管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #F3F4F6; }
        [v-cloak] { display: none !important; }
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div id="app" class="w-full max-w-4xl p-4" v-cloak>
        
        <div v-if="loading" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white">
            <div class="text-2xl font-bold animate-pulse mb-4">🛡️ 正在驗證您的權限...</div>
            <p class="text-gray-400">請稍候，系統正在為您準備專屬環境</p>
        </div>

        <div v-else class="bg-white rounded-xl shadow-xl overflow-hidden">
            <div class="bg-slate-800 p-6 sm:p-10 text-center text-white relative">
                <h1 class="text-3xl sm:text-4xl font-bold mb-2 tracking-wider">🚗 杰運汽車管理系統</h1>
                <p class="text-slate-300">企業級內部資源入口網</p>
                <div class="absolute top-4 right-4 flex flex-col items-end">
                    <span class="text-sm bg-green-600 px-3 py-1 rounded-full font-bold shadow-sm mb-2">🟢 已登入</span>
                    <button @click="logout" class="text-xs text-slate-400 hover:text-white underline">登出切換帳號</button>
                </div>
            </div>

            <div class="p-6 sm:p-10 bg-slate-50">
                <h2 class="text-xl font-bold text-slate-700 mb-6 border-b-2 border-slate-200 pb-2">請選擇您要使用的系統：</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    
                    <div @click="goTo('/cars', 'E車源看板')" :class="{'shake': shakeTarget === 'E車源看板'}" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-lg hover:border-blue-400 transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="text-5xl mb-4 group-hover:scale-110 transition duration-300">🚙</div>
                        <h3 class="text-xl font-bold text-slate-800 mb-1">E車源看板</h3>
                        <p class="text-sm text-slate-500">查看並篩選目前所有在庫車輛資訊</p>
                    </div>

                    <div @click="goTo('/deal', '成交系統')" :class="{'shake': shakeTarget === '成交系統'}" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-lg hover:green-400 transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="text-5xl mb-4 group-hover:scale-110 transition duration-300">🤝</div>
                        <h3 class="text-xl font-bold text-slate-800 mb-1">成交系統</h3>
                        <p class="text-sm text-slate-500">產生與管理車輛成交合約</p>
                    </div>

                    <div @click="goTo('/customer', '客資系統')" :class="{'shake': shakeTarget === '客資系統'}" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-lg hover:purple-400 transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="text-5xl mb-4 group-hover:scale-110 transition duration-300">👥</div>
                        <h3 class="text-xl font-bold text-slate-800 mb-1">客資系統</h3>
                        <p class="text-sm text-slate-500">管理與追蹤客戶需求與聯絡進度</p>
                    </div>

                    <div @click="goTo('/dispatch', '調度系統')" :class="{'shake': shakeTarget === '調度系統'}" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-lg hover:orange-400 transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="text-5xl mb-4 group-hover:scale-110 transition duration-300">🚛</div>
                        <h3 class="text-xl font-bold text-slate-800 mb-1">調度系統</h3>
                        <p class="text-sm text-slate-500">車輛跨店移動與物流派車管理</p>
                    </div>

                    <div @click="goTo('/tax', '稅金計算')" :class="{'shake': shakeTarget === '稅金計算'}" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-lg hover:red-400 transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="text-5xl mb-4 group-hover:scale-110 transition duration-300">💰</div>
                        <h3 class="text-xl font-bold text-slate-800 mb-1">稅金計算</h3>
                        <p class="text-sm text-slate-500">快速計算牌照稅、燃料稅依比例分攤</p>
                    </div>

                    <div @click="goTo('/copy', '快速回覆')" :class="{'shake': shakeTarget === '快速回覆'}" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-lg hover:indigo-400 transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="text-5xl mb-4 group-hover:scale-110 transition duration-300">📋</div>
                        <h3 class="text-xl font-bold text-slate-800 mb-1">快速回覆工具</h3>
                        <p class="text-sm text-slate-500">一鍵複製常用話術與報價模版</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-slate-200 p-4 text-center text-xs text-slate-500 font-mono">
                System Status: Ready | User ID: {{ userId }}
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const loading = ref(true);
                const userId = ref("");
                const myPermissions = ref({});
                const shakeTarget = ref("");

                const initAuth = async () => {
                    try {
                        // 初始化 LIFF
                        await liff.init({ liffId: "2009888743-q1JdQOEa" });
                        
                        if (!liff.isLoggedIn()) {
                            // 若未登入，強制跳去登入，登入完回到首頁
                            liff.login({ redirectUri: window.location.href });
                            return;
                        }
                        
                        const profile = await liff.getProfile();
                        userId.value = profile.userId;
                        
                        // 把 ID 存在記憶吐司裡
                        localStorage.setItem('jw_user_id', userId.value);
                        
                        // 呼叫 API 一次把所有權限抓回來
                        const res = await fetch(`/api/my_permissions?user_id=${userId.value}`);
                        const data = await res.json();
                        
                        if (data.status === "success") {
                            myPermissions.value = data.permissions;
                            // 把權限也存進記憶吐司，子網頁可以直接拿來用！
                            localStorage.setItem('jw_permissions', JSON.stringify(data.permissions));
                        }
                        
                        loading.value = false;
                    } catch (err) {
                        console.error("登入失敗", err);
                        alert("系統連線異常，請重新整理網頁");
                    }
                };

                const goTo = (url, actionName) => {
                    // 檢查權限
                    const isSuperAdmin = String(myPermissions.value['最高管理員']).toUpperCase() === 'V';
                    const hasActionAuth = String(myPermissions.value[actionName]).toUpperCase() === 'V';
                    
                    if (isSuperAdmin || hasActionAuth) {
                        // 有權限，直接放行
                        window.location.href = url;
                    } else {
                        // 沒權限，按鈕抖動並跳警告
                        shakeTarget.value = actionName;
                        setTimeout(() => shakeTarget.value = "", 500); // 抖動半秒後恢復
                        alert(`⛔ 存取被拒絕！\n\n抱歉，您的帳號尚未開通【${actionName}】的權限。\n請聯繫管理員為您開通。`);
                    }
                };

                const logout = () => {
                    localStorage.removeItem('jw_user_id');
                    localStorage.removeItem('jw_permissions');
                    try { liff.logout(); } catch(e) {}
                    window.location.reload();
                };

                onMounted(() => { initAuth(); });

                return { loading, userId, goTo, logout, shakeTarget };
            }
        }).mount('#app');
    </script>
</body>
</html>
