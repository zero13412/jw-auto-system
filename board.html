<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 💡 強制鎖定標題 -->
    <title>杰運汽車新竹店阿鍇專用 - 內部系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const userId = localStorage.getItem('jw_user_id');
        const permsRaw = localStorage.getItem('jw_permissions');
        
        if (!userId || !permsRaw) {
            window.location.href = "/";
        } else {
            const perms = JSON.parse(permsRaw);
            const isSuperAdmin = String(perms['最高管理員']).toUpperCase() === 'V';
            const hasAuth = String(perms['車前牌製作']).toUpperCase() === 'V'; 
            
            if (!isSuperAdmin && !hasAuth) {
                alert("⛔ 存取被拒絕！您沒有【車前牌製作】的使用權限。");
                window.location.href = "/";
            }
        }
    </script>

    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #F3F4F6; }
        [v-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="min-h-screen flex flex-col" v-cloak>
        
        <header class="bg-orange-600 text-white p-3 sm:p-4 shadow-md flex justify-between items-center z-10 relative">
            <h1 class="text-base sm:text-xl font-bold truncate pr-2">🏷️ 車前牌 & 影片文案生成系統</h1>
            <a href="/" class="bg-yellow-500 hover:bg-yellow-600 text-orange-900 font-bold px-3 py-1.5 sm:px-4 sm:py-2 rounded text-sm transition shadow-sm">
                🏠 首頁
            </a>
        </header>

        <div class="bg-orange-800 text-white text-xs py-1 px-4 text-center sm:text-right transition-colors duration-300" :class="statusColor">
            {{ statusMessage }}
        </div>

        <!-- 💡 調整為 items-stretch 讓左右兩邊高度一致 -->
        <div class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-4 grid lg:grid-cols-12 gap-4 items-stretch mt-2">
            
            <!-- 左側：輸入解析 (步驟1) + 欄位確認 (步驟2) -->
            <div class="lg:col-span-5 flex flex-col gap-4">
                
                <!-- 區塊 1：貼上文案 -->
                <div class="bg-white rounded-xl shadow-md border border-gray-200 p-5 flex flex-col">
                    <h2 class="text-lg font-bold text-orange-700 border-b pb-2 mb-4 flex items-center gap-2">
                        <span>1️⃣</span> 貼上廣告文案
                    </h2>
                    
                    <textarea v-model="rawText" placeholder="請將 FB 或 8891 的廣告文案直接貼在這裡..." 
                              class="w-full border-2 border-gray-200 rounded-lg p-3 focus:border-orange-400 focus:ring-0 transition resize-none text-sm leading-relaxed mb-4 min-h-[160px]"></textarea>
                    
                    <div class="flex gap-3">
                        <button @click="clearText" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg transition active:scale-95 shadow-sm">
                            🧹 清空
                        </button>
                        <button @click="parseAd" :disabled="loading" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition shadow-md active:scale-95 flex items-center justify-center gap-2">
                            <span v-if="!loading">✨ 智慧解析資料</span>
                            <span v-else>⏳ 處理中...</span>
                        </button>
                    </div>
                </div>

                <!-- 區塊 2：欄位確認 -->
                <div class="bg-white rounded-xl shadow-md border border-gray-200 p-5 flex-1 flex flex-col">
                    <h2 class="text-lg font-bold text-blue-700 border-b pb-2 mb-4 flex items-center gap-2">
                        <span>2️⃣</span> 確認與調整欄位
                    </h2>

                    <div class="grid grid-cols-2 gap-4 flex-1">
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-gray-600 text-xs">品牌</label>
                            <input type="text" v-model="parsed.brand" class="border-2 border-gray-200 rounded-lg p-1.5 focus:border-blue-400 focus:ring-0 text-sm font-bold">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-gray-600 text-xs">車型全名</label>
                            <input type="text" v-model="parsed.model" class="border-2 border-gray-200 rounded-lg p-1.5 focus:border-blue-400 focus:ring-0 text-sm font-bold">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-gray-600 text-xs">出廠日期</label>
                            <input type="text" v-model="parsed.man_date" class="border-2 border-gray-200 rounded-lg p-1.5 focus:border-blue-400 focus:ring-0 text-sm font-bold">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-gray-600 text-xs">領牌日期</label>
                            <input type="text" v-model="parsed.lic_date" class="border-2 border-gray-200 rounded-lg p-1.5 focus:border-blue-400 focus:ring-0 text-sm font-bold">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-gray-600 text-xs">里程數</label>
                            <input type="text" v-model="parsed.mileage" class="border-2 border-gray-200 rounded-lg p-1.5 focus:border-blue-400 focus:ring-0 text-sm font-bold">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-gray-400 text-xs">新車價(萬)</label>
                            <input type="text" v-model="parsed.new_price" class="border-2 border-gray-200 rounded-lg p-1.5 focus:border-blue-400 focus:ring-0 text-sm font-bold text-gray-500">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-gray-500 text-xs">店內價(萬)</label>
                            <input type="text" v-model="parsed.store_price" class="border-2 border-gray-200 rounded-lg p-1.5 focus:border-blue-400 focus:ring-0 text-sm font-bold">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-red-600 text-xs">優惠價(萬) - 車前牌用</label>
                            <input type="text" v-model="parsed.promo_price" class="border-2 border-red-200 rounded-lg p-1.5 focus:border-red-400 text-red-700 font-bold focus:ring-0 text-sm bg-red-50">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-indigo-600 text-xs">貸款期數</label>
                            <input type="text" v-model="parsed.loan_term" class="border-2 border-indigo-200 rounded-lg p-1.5 focus:border-indigo-400 text-indigo-700 font-bold focus:ring-0 text-sm">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-bold text-indigo-600 text-xs">月付金額</label>
                            <input type="text" v-model="parsed.loan_monthly" class="border-2 border-indigo-200 rounded-lg p-1.5 focus:border-indigo-400 text-indigo-700 font-bold focus:ring-0 text-sm">
                        </div>
                    </div>
                </div>

            </div>

            <!-- 右側：資料產出與超大腳本區 -->
            <div class="lg:col-span-7 bg-white rounded-xl shadow-md border border-gray-200 p-5 flex flex-col h-full min-h-[600px]">
                
                <h2 class="text-lg font-bold text-teal-700 border-b pb-2 mb-3 flex items-center gap-2">
                    <span>3️⃣</span> 車況選擇與最終輸出
                </h2>

                <!-- 車況選項 -->
                <div class="flex items-center gap-4 mb-3 bg-slate-50 p-2 rounded-lg border border-slate-100">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" v-model="conditionType" value="original" class="w-4 h-4 text-teal-600">
                        <span class="font-bold text-gray-700">✅ 原鈑件</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" v-model="conditionType" value="non_original" class="w-4 h-4 text-red-600">
                        <span class="font-bold text-red-600">⚠️ 非原鈑件</span>
                    </label>
                </div>

                <!-- 非原鈑件輸入框 -->
                <textarea v-if="conditionType === 'non_original'" v-model="damageText" 
                          class="w-full border-2 border-red-200 rounded-lg p-2 text-sm font-bold text-red-800 bg-red-50 focus:border-red-400 focus:ring-0 resize-none mb-3 shrink-0" rows="3"></textarea>

                <!-- 產生按鈕群 -->
                <div class="flex flex-col sm:flex-row gap-3 mb-4 pb-4 border-b">
                    <button @click="exportExcel" :disabled="loadingExp" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md active:scale-95 flex justify-center items-center gap-2 text-sm sm:text-base">
                        <span v-if="!loadingExp">💾 下載車前牌 Excel</span>
                        <span v-else>⏳ 產生中...</span>
                    </button>
                    
                    <button @click="generateScript" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition shadow-md active:scale-95 flex justify-center items-center gap-2 text-sm sm:text-base">
                        🎬 產生影片腳本
                    </button>
                </div>

                <!-- 💡 腳本輸出區：自動填滿剩下的高度 flex-1 -->
                <div v-if="videoScript" class="relative flex flex-col flex-1">
                    <div class="flex justify-between items-center bg-gray-100 p-2 border border-b-0 border-gray-200 rounded-t-lg shrink-0">
                        <span class="text-sm font-bold text-gray-700">📝 影片文案預覽</span>
                        <button @click="copyScript" class="bg-gray-800 hover:bg-black text-white font-bold px-4 py-1.5 rounded text-sm transition shadow-sm active:scale-95">📋 一鍵複製</button>
                    </div>
                    <textarea v-model="videoScript" class="w-full flex-1 border-2 border-gray-200 rounded-b-lg p-4 text-base sm:text-lg text-gray-800 focus:outline-none resize-none leading-relaxed font-bold bg-amber-50" readonly></textarea>
                </div>

                <!-- 預設等待畫面 -->
                <div v-else class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 text-gray-400 font-bold">
                    <span class="text-4xl mb-2">🎬</span>
                    <p>請先解析文案並點擊「產生影片腳本」</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive } = Vue;

        createApp({
            setup() {
                const rawText = ref("");
                const statusMessage = ref("系統準備就緒");
                const statusColor = ref("text-orange-200");
                const loading = ref(false);
                const loadingExp = ref(false);
                
                const conditionType = ref("original");
                const damageText = ref("結構部份此車結構無做過任何更換\n右前樑頭有輕微版修痕跡\n較行情便宜四萬\n右前門板出保換新\n較正常行情便宜兩萬\n左前葉出保換新\n較正常行情便宜三萬\n後尾門換新\n較正常行情便宜兩萬\n實際較正常車況便宜共計xx萬元");
                const videoScript = ref("");

                const parsed = reactive({
                    brand: "", model: "", man_date: "", lic_date: "", mileage: "", 
                    new_price: "", store_price: "", promo_price: "", loan_term: "", loan_monthly: ""
                });

                const updateStatus = (msg, colorClass) => {
                    statusMessage.value = msg;
                    statusColor.value = colorClass;
                };

                const clearText = () => {
                    rawText.value = "";
                    Object.keys(parsed).forEach(k => parsed[k] = "");
                    videoScript.value = "";
                    updateStatus("🧹 已清空內容", "text-orange-200");
                };

                const parseAd = async () => {
                    if (!rawText.value.trim()) {
                        updateStatus("⚠️ 請先貼上廣告文案！", "text-yellow-300 font-bold");
                        return;
                    }
                    loading.value = true;
                    updateStatus("⏳ 正在由 AI 智慧解析...", "text-blue-300 font-bold");
                    
                    try {
                        const res = await fetch("/api/parse_ad", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ text: rawText.value })
                        });
                        const result = await res.json();
                        
                        if (result.status === "success") {
                            Object.assign(parsed, result.data);
                            updateStatus(`✅ 解析成功！請確認左側下方欄位。`, "text-green-300 font-bold");
                        } else {
                            updateStatus("❌ 解析失敗", "text-red-300 font-bold");
                        }
                    } catch (e) {
                        updateStatus("❌ 網路連線錯誤", "text-red-300 font-bold");
                    } finally {
                        loading.value = false;
                    }
                };

                const exportExcel = async () => {
                    if (!parsed.brand && !parsed.model) {
                        updateStatus("⚠️ 請先完成解析再下載", "text-yellow-300 font-bold");
                        return;
                    }
                    loadingExp.value = true;
                    updateStatus("⏳ 正在產生 Excel...", "text-blue-300 font-bold");
                    
                    try {
                        const payload = {
                            brand: parsed.brand,
                            model: parsed.model,
                            man_date: parsed.man_date,
                            lic_date: parsed.lic_date,
                            mileage: parsed.mileage,
                            price: parsed.promo_price
                        };

                        const res = await fetch("/api/export_board", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });
                        
                        if (!res.ok) throw new Error("下載失敗");
                        
                        const blob = await res.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        
                        let y = "0000";
                        const m = parsed.man_date.match(/(\d{4})/);
                        if (m) y = m[1];
                        
                        a.download = `車前牌_${y}_${parsed.brand}_${parsed.model}.xlsx`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        
                        updateStatus("✅ Excel 下載完成！", "text-green-300 font-bold");
                    } catch (e) {
                        updateStatus("❌ 下載發生錯誤", "text-red-300 font-bold");
                    } finally {
                        loadingExp.value = false;
                    }
                };

                const calculateDamageTotal = (text) => {
                    let total = 0;
                    const regex = /便宜(\d+)萬/g;
                    let match;
                    while ((match = regex.exec(text)) !== null) {
                        total += parseInt(match[1]);
                    }
                    if (total > 0) {
                        return text.replace(/共計.*?萬/, `共計${total}萬`);
                    }
                    return text;
                };

                const generateScript = () => {
                    const d = parsed;
                    const carName = d.model ? `${d.brand || ''} ${d.model}`.trim() : "(車名)";
                    const manDate = d.man_date || "(出廠日)";
                    const licDate = d.lic_date || "(領牌日)";
                    const mileage = d.mileage || "(里程)";
                    const newPrice = d.new_price || "(新車價)";
                    const storePrice = d.store_price || "(店內價)";
                    const promoPrice = d.promo_price || "(優惠價)";
                    const loanTerm = d.loan_term || "xx";
                    const loanMonthly = d.loan_monthly || "xxxx";

                    let bodyText = "";
                    if (conditionType.value === "original") {
                        bodyText = "鈑件部份\n此車結構以及鈑件均無做過任何更換\n為原鈑件";
                    } else {
                        damageText.value = calculateDamageTotal(damageText.value);
                        bodyText = damageText.value;
                    }

                    let discountLine = "購買可當兩萬折抵等於再折扣一萬一\n";
                    if (parseFloat(promoPrice) < 15.0) {
                        discountLine = "";
                    }

                    videoScript.value = `大家好這裡是杰運汽車日常頻道
今天來為大家介紹這台
${carName}
此車在${manDate}出廠
${licDate}領牌
儀錶板實際里程數是${mileage}
查核監理系統里程數據也符合

${bodyText}

新車價格${newPrice}萬
店內價格${storePrice}萬
網路購車加碼優惠折扣三萬
價格是${promoPrice}萬

另有線上預約全台賞車專案
只要刷卡九千元
就可以免費託運至當地服務據點
${discountLine}未購買只需依距離負擔一千到兩千五百元拖車保險費用

貸款部分這邊也幫您試算好
零頭款
分期${loanTerm}期
月付金額也只要${loanMonthly}元
並且關稅戰杰運汽車再加碼
好禮二選一
第一十五萬十二期零利率的補貼息三千兩百元
第二贈送兩次基礎保養市值八千到一萬元

保固部分
保固您引擎變速箱方向機三大系統
2014年以後
里程數二十萬以內的車型
更是加碼只要在店內做自費大保養
都可以升級成一年的延長保固
接下來讓我們由車頭開始逐一帶大家來賞車`;

                    updateStatus("✅ 影片腳本生成成功！", "text-teal-300 font-bold");
                };

                const copyScript = () => {
                    if (!videoScript.value) return;
                    navigator.clipboard.writeText(videoScript.value).then(() => {
                        updateStatus("📋 腳本已複製！", "text-yellow-300 font-bold");
                    });
                };

                return { 
                    rawText, parsed, statusMessage, statusColor, loading, loadingExp, 
                    conditionType, damageText, videoScript,
                    clearText, parseAd, exportExcel, generateScript, copyScript
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
