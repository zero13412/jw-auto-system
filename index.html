<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 杰運汽車新竹店阿鍇專用 - 內部系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 relative">
    
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white">
        <div class="text-2xl font-bold animate-pulse mb-4 flex items-center gap-3">
            <span class="text-4xl">🛡️</span> 正在驗證您的存取權限...
        </div>
    </div>

    <div class="max-w-6xl w-full" id="mainContent" style="display: none;">
        <div class="text-center mb-8 flex flex-col items-center">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-2">杰運汽車新竹店阿鍇專用 - 內部系統</h1>
            <p class="text-slate-500 font-bold mb-4">請選擇您要使用的工具</p>
            
            <button onclick="liffLogout()" id="userBadge" class="inline-flex items-center justify-center gap-2 text-sm bg-white border border-gray-200 text-slate-700 px-4 py-1.5 rounded-full hover:bg-slate-50 transition shadow-sm font-bold">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                載入中...
            </button>
        </div>
        
        <div class="grid md:grid-cols-3 gap-6">
            <a onclick="goToPage(event, '/cars', 'E車源看板')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🔍</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">E車源分析系統</h2>
            </a>
            
            <a onclick="goToPage(event, '/deal', '成交系統')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🤝</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">恭喜成交系統</h2>
            </a>

            <a onclick="goToPage(event, '/dispatch', '調度系統')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🚚</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">車輛調度系統</h2>
            </a>

            <a onclick="goToPage(event, '/loan', '分期試算')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📈</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">分期試算工具</h2>
            </a>

            <a onclick="goToPage(event, '/simple', '新竹看板')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📊</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">新竹車源即時看板</h2>
            </a>

            <a onclick="goToPage(event, '/tax', '稅金計算')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">💰</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">稅金計算小幫手</h2>
            </a>

            <a onclick="goToPage(event, '/cs', '戰情室')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📞</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">收車估價戰情室</h2>
            </a>

            <a onclick="goToPage(event, '/customer', '客資系統')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">👥</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">客資管理看板</h2>
            </a>

            <a onclick="goToPage(event, '/copy', '快速回覆')" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-8 text-center border border-gray-200 group transform hover:-translate-y-1 flex flex-col items-center justify-center cursor-pointer">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📋</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">快捷回覆工具</h2>
            </a>
        </div>
    </div>

    <script>
        let myPermissions = {};

        function updateUserBadge(perms, fallbackName) {
            const name = perms['姓名'] || fallbackName || '已登入';
            document.getElementById('userBadge').innerHTML = `
                <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span>
                ${name} <span class="text-xs font-normal text-gray-400 ml-1">(登出)</span>`;
        }

        async function initAuth() {
            const storedUserId = localStorage.getItem('jw_user_id');
            const storedUserName = localStorage.getItem('jw_user_name') || '';

            try {
                await liff.init({ liffId: "2009888743-q1JdQOEa" });
                if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }
                
                const profile = await liff.getProfile();
                const userId = profile.userId;
                const userName = profile.displayName;
                
                localStorage.setItem('jw_user_id', userId); 
                localStorage.setItem('jw_user_name', userName);

                const res = await fetch(`/api/my_permissions?user_id=${userId}&user_name=${encodeURIComponent(userName)}`);
                const data = await res.json();
                
                if (data.status === "success") {
                    myPermissions = data.permissions;
                    localStorage.setItem('jw_permissions', JSON.stringify(myPermissions));
                    if (data.is_new) alert(`👋 歡迎首次使用，${userName}！\n\n系統已自動為您提交開通申請。\n請告知阿鍇幫您點亮「V」即可開始使用。`);
                }
                
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                updateUserBadge(myPermissions, userName);
                
            } catch (err) { alert("登入失敗，請檢查網路"); }
        }

        function goToPage(event, url, actionName) {
            event.preventDefault(); 
            const isSuperAdmin = String(myPermissions['最高管理員'] || '').toUpperCase() === 'V';
            const hasAuth = String(myPermissions[actionName] || '').toUpperCase() === 'V';
            if (isSuperAdmin || hasAuth) window.location.href = url;
            else alert(`⛔ 存取被拒絕！\n\n您尚未開通【${actionName}】的權限。`);
        }

        function liffLogout() {
            localStorage.clear();
            try { liff.logout(); } catch(e) {}
            window.location.reload();
        }

        window.onload = initAuth;
    </script>
</body>
</html>
