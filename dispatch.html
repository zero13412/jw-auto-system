<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚚 車輛調度與訂購系統 - 杰運汽車</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #F3F4F6; }
        [v-cloak] { display: none !important; }
        textarea { overflow-y: hidden; } 
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="min-h-screen flex flex-col" v-cloak>
        
        <header class="bg-cyan-700 text-white p-3 sm:p-4 shadow-md flex justify-between items-center z-10 relative">
            <h1 class="text-base sm:text-xl font-bold truncate pr-2">🚚 車輛調度與訂購系統</h1>
            <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                <a href="/" class="bg-yellow-500 hover:bg-yellow-600 text-cyan-900 font-bold px-3 py-1.5 sm:px-4 sm:py-2 rounded text-sm transition shadow-sm">
                    🏠 首頁
                </a>
            </div>
        </header>

        <div class="bg-cyan-800 text-white text-xs py-1 px-4 text-center sm:text-right transition-colors duration-300" :class="statusColor">
            {{ statusMessage }}
        </div>

        <div class="flex-1 flex flex-col md:flex-row p-2 sm:p-4 gap-4 overflow-y-auto md:overflow-hidden h-full">
            
            <aside class="w-full md:w-80 lg:w-96 bg-white rounded-lg shadow-sm border p-4 flex-shrink-0 md:overflow-y-auto h-auto md:h-full space-y-4">
                
                <div class="border-b pb-4">
                    <h2 class="font-bold text-gray-700 mb-2">1. 搜尋車輛 (自動帶入地點)</h2>
                    <div class="flex gap-2">
                        <input v-model="searchQuery" @keyup.enter="searchCar" type="text" placeholder="輸入車牌" class="flex-1 border border-gray-300 rounded p-2 focus:ring-2 focus:ring-cyan-400 focus:outline-none uppercase text-lg font-bold">
                        <button @click="searchCar" class="bg-cyan-600 text-white px-4 py-2 rounded hover:bg-cyan-700 transition font-bold shadow-sm">搜尋</button>
                    </div>
                </div>

                <div class="border-b pb-4 space-y-3">
                    <h2 class="font-bold text-gray-700 mb-2">2. 客戶與賞車資訊</h2>
                    
                    <div class="flex items-center gap-2">
                        <label class="w-20 text-sm font-bold text-gray-600">客源來源:</label>
                        <select v-model="settings.custSrc" class="flex-1 border rounded p-1.5 bg-white text-sm focus:ring-1 focus:ring-cyan-400 focus:outline-none">
                            <option value="網路客">網路客</option>
                            <option value="自行開發">自行開發</option>
                            <option value="電話客">電話客</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="w-20 text-sm font-bold text-gray-600">客戶稱呼:</label>
                        <input v-model="settings.custName" type="text" class="flex-1 border rounded p-1.5 text-sm focus:ring-1 focus:ring-cyan-400 focus:outline-none">
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <label class="w-20 text-sm font-bold text-blue-600">賞車日期:</label>
                        <input v-model="settings.viewDate" type="text" placeholder="如: 4/2(四)" class="flex-1 border border-blue-200 bg-blue-50 rounded p-1.5 text-sm focus:ring-1 focus:ring-cyan-400 focus:outline-none font-bold">
                    </div>

                    <div class="flex items-center justify-between gap-1 mt-2 bg-gray-50 p-2 rounded border">
                        <div class="flex flex-col flex-1">
                            <label class="text-xs font-bold text-gray-500">車輛所在地</label>
                            <select v-model="settings.locFrom" :disabled="settings.mode === 'reserve'" class="border rounded p-1 text-sm bg-white mt-1 focus:ring-1 focus:ring-cyan-400 focus:outline-none">
                                <option v-for="l in locations" :value="l">{{ l }}</option>
                            </select>
                        </div>
                        <div class="text-gray-400 font-bold px-1 mt-4">➜</div>
                        <div class="flex flex-col flex-1">
                            <label class="text-xs font-bold text-red-600">客戶賞車地</label>
                            <select v-model="settings.locTo" :disabled="settings.mode === 'reserve'" class="border rounded p-1 text-sm bg-white mt-1 focus:ring-1 focus:ring-cyan-400 focus:outline-none">
                                <option v-for="l in locations" :value="l">{{ l }}</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="border-b pb-4 space-y-3">
                    <h2 class="font-bold text-gray-700 mb-2">3. 作業模式 & 付款</h2>
                    
                    <div class="flex flex-col gap-2 text-sm bg-cyan-50 p-2 rounded border border-cyan-100">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" v-model="settings.mode" value="transfer" class="text-cyan-600 focus:ring-cyan-500"> <span class="font-bold text-cyan-900">[模式1] 付費調度 (賞車)</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" v-model="settings.mode" value="reserve" class="text-cyan-600 focus:ring-cyan-500"> <span class="font-bold text-cyan-900">[模式2] 不用調度 保留優惠</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" v-model="settings.mode" value="order" class="text-cyan-600 focus:ring-cyan-500"> <span class="text-gray-700">[模式3] 已訂購整備 (交車)</span></label>
                    </div>

                    <div class="flex items-center gap-2 mt-2">
                        <label class="text-sm font-bold text-gray-700 w-12">金額:</label>
                        <input v-model="settings.amount" :disabled="settings.mode === 'order'" type="number" class="w-24 border rounded p-1.5 font-bold text-red-600 focus:ring-1 focus:ring-cyan-400 focus:outline-none">
                        <span class="text-xs text-gray-500">{{ amountHint }}</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <label class="text-sm font-bold text-gray-700 w-12">付款:</label>
                        <div class="flex gap-3 text-sm">
                            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" v-model="settings.payMethod" value="現金" :disabled="settings.mode === 'order'"> 現金</label>
                            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" v-model="settings.payMethod" value="刷卡" :disabled="settings.mode === 'order'"> 刷卡</label>
                            <label class="flex items-center gap-1 cursor-pointer"><input type="radio" v-model="settings.payMethod" value="匯款" :disabled="settings.mode === 'order'"> 匯款</label>
                        </div>
                    </div>

                    <div v-if="settings.payMethod === '匯款' && settings.mode !== 'order'" class="flex items-center gap-2">
                        <label class="text-sm font-bold text-gray-700 w-20">後五碼:</label>
                        <input v-model="settings.last5" type="text" class="flex-1 border rounded p-1.5 focus:ring-1 focus:ring-cyan-400 focus:outline-none" placeholder="輸入帳號後五碼">
                    </div>
                </div>

                <div>
                    <h2 class="font-bold text-gray-700 mb-2">4. 車輛明細</h2>
                    <div class="grid grid-cols-2 gap-2 text-xs sm:text-sm">
                        <div class="flex flex-col"><label class="text-gray-500 mb-1">車牌</label><input v-model="car.plate" type="text" class="border p-1.5 rounded bg-gray-50 font-bold focus:outline-none"></div>
                        <div class="flex flex-col"><label class="text-gray-500 mb-1">廠牌</label><input v-model="car.brand" type="text" class="border p-1.5 rounded bg-gray-50 focus:outline-none"></div>
                        <div class="flex flex-col"><label class="text-gray-500 mb-1">年份</label><input v-model="car.year" type="text" class="border p-1.5 rounded bg-gray-50 focus:outline-none"></div>
                        <div class="flex flex-col"><label class="text-gray-500 mb-1">顏色</label><input v-model="car.color" type="text" class="border p-1.5 rounded bg-gray-50 focus:outline-none"></div>
                        <div class="flex flex-col col-span-2"><label class="text-gray-500 mb-1">車型</label><input v-model="car.model" type="text" class="border p-1.5 rounded bg-gray-50 focus:outline-none"></div>
                        <div class="flex flex-col"><label class="text-gray-500 mb-1">里程(萬)</label><input v-model="car.mileage" type="text" class="border p-1.5 rounded bg-gray-50 focus:outline-none"></div>
                        
                        <div class="flex flex-col"><label class="text-red-600 font-bold mb-1">產權公司</label><input v-model="car.company" type="text" class="border border-red-200 p-1.5 rounded bg-yellow-50 text-red-700 font-bold focus:outline-none" placeholder="系統自動判斷"></div>
                    </div>
                </div>

                <button @click="generateTexts" class="w-full bg-cyan-700 hover:bg-cyan-800 text-white font-bold py-3 sm:py-4 px-4 rounded mt-4 shadow-md transition active:scale-95 text-lg">
                    ✨ 生成回報與話術 ✨
                </button>
            </aside>

            <main class="flex-1 flex flex-col gap-4 overflow-y-auto pb-10 md:pb-4 h-full relative p-1">
                
                <div class="flex flex-col bg-white border rounded-lg shadow-sm shrink-0">
                    <div class="bg-gray-100 p-2 sm:p-3 border-b flex justify-between items-center rounded-t-lg sticky top-0 z-10">
                        <span class="font-bold text-gray-700 text-sm sm:text-base">🏢 公司內部回報</span>
                        <button v-if="output.report" @click="copyContent(output.report)" class="bg-cyan-100 hover:bg-cyan-200 text-cyan-800 font-bold px-3 py-1 rounded text-sm transition shadow-sm active:scale-95">📋 複製回報</button>
                    </div>
                    <div v-if="!output.report" class="p-8 text-center text-gray-400 text-sm">請先點擊左下角生成按鈕...</div>
                    <textarea v-else id="reportArea" v-model="output.report" class="w-full p-3 sm:p-4 resize-none focus:outline-none text-sm sm:text-base leading-relaxed font-mono bg-white min-h-[200px]" readonly></textarea>
                </div>

                <div class="flex flex-col bg-white border rounded-lg shadow-sm shrink-0 mb-4">
                    <div class="bg-gray-100 p-2 sm:p-3 border-b rounded-t-lg sticky top-0 z-10 flex justify-between items-center">
                        <span class="font-bold text-gray-700 text-sm sm:text-base">💬 對客說明話術 (四段分開複製)</span>
                        <span class="text-xs text-gray-500 font-normal hidden sm:inline">可依對話節奏，一段一段發送給客人</span>
                    </div>
                    
                    <div v-if="output.pitches.length === 0" class="p-8 text-center text-gray-400 text-sm bg-gray-50 rounded-b-lg">
                        請先搜尋車輛並點擊「✨ 生成回報與話術 ✨」
                    </div>

                    <div v-else class="p-3 sm:p-4 space-y-4 bg-gray-50 rounded-b-lg">
                        <div v-for="(pitch, index) in output.pitches" :key="index" class="bg-white border border-gray-200 rounded-lg shadow-sm p-4 relative hover:shadow-md transition">
                            <div class="flex justify-between items-center mb-3 border-b pb-2">
                                <span class="text-sm font-bold text-cyan-700 bg-cyan-50 px-2 py-1 rounded">第 {{ index + 1 }} 段</span>
                                <button @click="copyContent(pitch)" class="bg-green-100 hover:bg-green-200 text-green-800 font-bold px-3 py-1 rounded text-xs sm:text-sm transition shadow-sm active:scale-95">
                                    📋 複製此段
                                </button>
                            </div>
                            <pre class="w-full whitespace-pre-wrap font-sans text-sm sm:text-base leading-relaxed text-gray-700 m-0">{{ pitch }}</pre>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, watch, computed, nextTick } = Vue;
        const API_URL = "/api"; 

        createApp({
            setup() {
                const statusMessage = ref("系統準備就緒");
                const statusColor = ref("text-cyan-200");
                const searchQuery = ref("");

                const locations = ["台北", "桃園", "新竹", "台中", "高雄"];
                const priceMatrix = {
                    "台北": {"台北": 0, "桃園": 1000, "新竹": 1500, "台中": 2000, "高雄": 2500},
                    "桃園": {"台北": 1000, "桃園": 0, "新竹": 1000, "台中": 1500, "高雄": 2000},
                    "新竹": {"台北": 1500, "桃園": 1000, "新竹": 0, "台中": 1000, "高雄": 2000},
                    "台中": {"台北": 2000, "桃園": 1500, "新竹": 1000, "台中": 0, "高雄": 2000},
                    "高雄": {"台北": 2500, "桃園": 2000, "新竹": 2000, "台中": 2000, "高雄": 0}
                };

                const settings = reactive({
                    custSrc: "網路客", custName: "李明哲", viewDate: "",
                    locFrom: "桃園", locTo: "新竹",
                    mode: "reserve", amount: 1000,
                    payMethod: "匯款", last5: ""
                });

                const car = reactive({
                    plate: '', brand: '', model: '', year: '', color: '', mileage: '', company: ''
                });

                const output = reactive({ report: "", pitches: [] });

                const autoResizeReport = () => {
                    nextTick(() => {
                        let el = document.getElementById('reportArea');
                        if (el) {
                            el.style.height = 'auto';
                            let newHeight = el.scrollHeight;
                            if (newHeight < 200) newHeight = 200;
                            el.style.height = newHeight + 'px';
                        }
                    });
                };

                const updateStatus = (msg, colorClass) => {
                    statusMessage.value = msg;
                    statusColor.value = colorClass;
                };

                const amountHint = computed(() => {
                    if (settings.mode === 'order') return "";
                    if (settings.mode === 'reserve') return "(請自行輸入金額)";
                    
                    let fee = priceMatrix[settings.locFrom]?.[settings.locTo] || 0;
                    if (fee === 0) return "(同門市，無調度費)";
                    return `(自動查表: $${fee})`;
                });

                watch([() => settings.locFrom, () => settings.locTo, () => settings.mode], () => {
                    if (settings.mode === 'transfer') {
                        settings.amount = priceMatrix[settings.locFrom]?.[settings.locTo] || 0;
                    }
                });

                const searchCar = async () => {
                    if (!searchQuery.value) return;
                    updateStatus("搜尋中...", "text-yellow-300 font-bold");
                    
                    try {
                        const res = await fetch(`${API_URL}/search_plate?plate=${encodeURIComponent(searchQuery.value)}`);
                        const result = await res.json();
                        
                        if (result.status === "success") {
                            const d = result.data;
                            car.plate = d['車牌'] || searchQuery.value.toUpperCase();
                            car.brand = d['廠牌'] || '';
                            car.model = d['車型'] || '';
                            car.year = d['clean_year'] || '';
                            car.color = d['顏色'] || '';
                            car.mileage = d['里程'] || '';
                            
                            // 【新增】：自動抓取產權公司
                            car.company = (d['產權'] && d['產權'] !== 'nan') ? d['產權'] : ((d['公司'] && d['公司'] !== 'nan') ? d['公司'] : '');
                            
                            let dbLoc = (d['車輛位置'] || '').replace('店', '');
                            if (dbLoc.includes('北投') || dbLoc.includes('立賢')) dbLoc = '台北';
                            
                            if (locations.includes(dbLoc)) {
                                settings.locFrom = dbLoc;
                            }
                            
                            updateStatus(`✅ 找到車輛：${car.model} (產權: ${car.company || '無'})`, "text-green-300 font-bold");
                        } else {
                            car.plate = searchQuery.value.toUpperCase();
                            updateStatus("❌ 查無此車，請手動輸入明細", "text-red-300 font-bold");
                        }
                    } catch (e) {
                        updateStatus("❌ 網路連線錯誤", "text-red-300 font-bold");
                    }
                };

                const generateTexts = () => {
                    generateReport();
                    generatePitch();
                    
                    if (window.innerWidth < 768) {
                        setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 100);
                    }
                    updateStatus(`⚡ 文案與話術生成完畢！`, "text-green-300 font-bold");
                };

                const generateReport = () => {
                    let last5_info = "";
                    let check_receipt_msg = "";
                    if (settings.payMethod === "匯款" && settings.mode !== "order") {
                        last5_info = settings.last5 ? `(帳號後五碼：${settings.last5})` : "(帳號後五碼：未填)";
                        check_receipt_msg = "\n煩請公司查收";
                    }

                    const today = new Date();
                    const today_str = `${today.getMonth() + 1}/${today.getDate()}`;
                    const route_str = `杰運${settings.locFrom}-》杰運${settings.locTo}`;
                    let plate_str = car.plate.toUpperCase();
                    if (plate_str && !plate_str.startsWith("#")) plate_str = "#" + plate_str;

                    let view_date_str = settings.viewDate ? `${settings.viewDate} ` : "";
                    
                    // 【新增】：判斷是否為非杰運車源
                    let source_str = "";
                    if (car.company && !car.company.includes("杰")) {
                        if (car.company.includes("禾迪")) source_str = "(禾迪車源)";
                        else if (car.company.includes("展帆")) source_str = "(展帆車源)";
                        else source_str = `(${car.company}車源)`;
                    }

                    let text_out = "";
                    // ==========================================
                    // 【修改】：全面套用新竹店的專屬排版格式
                    // ==========================================
                    if (settings.mode === "order") {
                        text_out = `${today_str} 新竹${settings.custSrc} ${settings.custName}\n`;
                        text_out += `訂購${settings.locFrom} ${car.year}年 ${car.model} ${car.color}${source_str}\n`;
                        text_out += `${settings.locTo}整備交車 再麻煩公司協助調度\n\n`;
                        text_out += `${route_str}\n`;
                        text_out += `${plate_str}\n`;
                        text_out += `里程：${car.mileage}萬公里`;
                        
                    } else if (settings.mode === "transfer") {
                        text_out = `${today_str} 新竹${settings.custSrc} ${settings.custName}\n`;
                        text_out += `線上預約$${settings.amount} ${settings.payMethod} 調度賞車\n`;
                        text_out += `${view_date_str}預約${settings.locTo}店賞車\n\n`;
                        text_out += `${route_str}\n`;
                        text_out += `${car.year}年${car.model} ${car.color}${source_str}\n`;
                        text_out += `里程：${car.mileage}萬公里\n`;
                        text_out += `${plate_str}\n`;
                        text_out += `麻煩公司安排調度\n`;
                        text_out += `已告知客戶未購買需負擔$${settings.amount}`;
                        if (settings.payMethod === "匯款") text_out += `\n${last5_info}${check_receipt_msg}`;
                        
                    } else if (settings.mode === "reserve") {
                        text_out = `${today_str} 新竹${settings.custSrc} ${settings.custName}\n`;
                        text_out += `線上預約$${settings.amount} ${settings.payMethod} 保留優惠七天\n`;
                        text_out += `${view_date_str}直接到${settings.locTo}店賞車\n\n`;
                        text_out += `${car.year}年${car.model} ${car.color}${source_str}\n`;
                        text_out += `里程：${car.mileage}萬公里\n`;
                        text_out += `${plate_str}`;
                        if (settings.payMethod === "匯款") text_out += `\n${last5_info}${check_receipt_msg}`;
                    }
                    
                    output.report = text_out;
                    autoResizeReport();
                };

                const generatePitch = () => {
                    if (settings.locFrom === settings.locTo) {
                        output.pitches = [`車輛目前已在「${settings.locTo}」店，可以直接邀請客戶來店賞車！\n無需收取調度費。`];
                        return;
                    }

                    let fee = parseInt(settings.amount) || priceMatrix[settings.locFrom]?.[settings.locTo] || 0;
                    let deposit_balance = 29000 - fee;

                    const p1 = `賞車有兩種方式\n\n您直接到「${settings.locFrom}」店賞車的話\n我們可以補貼您 單人單趟的高鐵費\n現場看過車覺得不喜歡 不買也有補貼\n\n缺點就是您要跑一趟 而且如果好幾個人一起去就划不來\n因為只有補貼一個人 去程 (自行開車沒有)`;
                    
                    const p2 = `另一種方式是 您可線上預刷 ${fee} 元調度金\n我們可幫您把車調度到「${settings.locTo}」店\n如果車到「${settings.locTo}」 您覺得OK 簽約\n${fee} 可折抵車價 不用額外付調度費\n\n那如果車調度到「${settings.locTo}」後 您看過車不想買 也沒有其他考慮的車款\n${fee} 元就沒有退 當作您部分負擔調度費`;
                    
                    const p3 = `再跟您詳細說明\n${fee} 是調度金 不是訂金 \n您預刷 ${fee} 後 是第一順位\n\n因為我們車跑的速度蠻快\n車子調度需要排隊\n假設\n1. 車子還沒調度 \n2. 調度到了 您來看車之前\n有第二順位出現 想直接付訂金\n(我們訂金是收 29000 元)\n會馬上告知您 您有3小時考慮時間\n\n如您有意願購買 就必須3小時內 補刷 ${deposit_balance} 元\n如您沒有意願 就會安排會計小姐 刷退 ${fee} 元`;
                    
                    const p4 = `但如果 您決定要直接到 「${settings.locFrom}」店賞車 還是建議您 先預付 ${fee} 元賞車金 (刷卡匯款都可)\n\n直接過去 就沒有拖車 不買需付 ${fee} 元的問題\n不滿意 也不考慮其他車款 ${fee} 元可全退\n而且您就是第一順位 如有其他人想買 您可考慮3小時\n\n因為我們常常發生 客人在路上 結果車被現場客人買走`;

                    output.pitches = [p1, p2, p3, p4];
                };

                const copyContent = (textToCopy) => {
                    if (!textToCopy) return;
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        updateStatus(`✅ 複製成功！可以去貼給客人了！`, "text-yellow-300 font-bold");
                        setTimeout(() => updateStatus("系統準備就緒", "text-cyan-200"), 3000);
                    });
                };

                return {
                    statusMessage, statusColor, searchQuery,
                    locations, settings, car, output, amountHint,
                    searchCar, generateTexts, copyContent
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
